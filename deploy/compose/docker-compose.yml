# The zero-hardware dev estate (spec §19): `docker compose up` gives a full
# working system — event log, stores, services, and the deterministic
# scenario suite — on a laptop, on day one.
#
# Reviewed by inspection in this repo's CI environment (no docker daemon
# there); the native equivalent `make sim` is what CI executes and gates on.

name: aegis-dev

services:
  redpanda:
    image: redpandadata/redpanda:v24.1.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    # TimescaleDB + pgvector + PostGIS per db/schema.sql (spec §7.2).
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis-dev-only
    volumes:
      - ../../db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Content-addressed media store: the SHA-256 IS the object key (§7.2).
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aegis
      MINIO_ROOT_PASSWORD: aegis-dev-only
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  go-services:
    # threat-cli / evidence-cli / evidence-verify / playbook-lint / ontology
    # rebuild-check — one image, multiple entrypoints (M0: CLIs; M1: gRPC).
    build:
      context: ../..
      dockerfile: deploy/compose/go.Dockerfile
    depends_on:
      redpanda: { condition: service_healthy }
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: ["sleep", "infinity"] # M0: tools image; sim execs into it

  ontologyd:
    # The digital twin over gRPC, folding the file-backed event log
    # (ADR-0005). The Redpanda backend replaces the file behind the same
    # eventlog seam.
    build:
      context: ../..
      dockerfile: deploy/compose/go.Dockerfile
    command:
      ["/usr/local/bin/ontologyd", "--property", "ridgeline", "--log", "/data/world.log", "--listen", ":7200"]
    volumes:
      - ontology-data:/data
    ports: ["7200:7200"]

  bffd:
    # The read edge: HTTP + SSE, persona-gated, no authority of its own.
    build:
      context: ../..
      dockerfile: deploy/compose/go.Dockerfile
    command:
      ["/usr/local/bin/bffd", "--property", "ridgeline", "--ontology", "ontologyd:7200", "--listen", ":7400"]
    depends_on:
      ontologyd: { condition: service_started }
    ports: ["7400:7400"]

  sim:
    # The M0 acceptance gate: the synthetic estate end to end, zero hardware.
    build:
      context: ../..
      dockerfile: deploy/compose/rust.Dockerfile
    depends_on:
      go-services: { condition: service_started }
    command:
      - /usr/local/bin/aegis-sim
      - run-all
      - --scenarios=/aegis/sim/scenarios
      - --fixtures=/aegis/sim/fixtures
      - --playbooks=/aegis/playbooks
      - --bin=/usr/local/bin

volumes:
  ontology-data:
