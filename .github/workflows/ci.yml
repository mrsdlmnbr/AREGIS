# AEGIS CI — the gates of CLAUDE.md "when you are done with a change":
# lint (incl. architecture lints), test (incl. Governor property suites),
# and the deterministic replay of the scenario suite. A replay diff is a
# behaviour change in a system that authorizes physical action; it fails
# here so a human investigates it.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc (aegis-proto build dependency)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cd py && python3 -m unittest discover -s . -p 'test_*.py'

  archlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/archlint.sh

  playbook-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - run: go build -o bin/playbook-lint ./tools/playbook-lint
      - run: bin/playbook-lint playbooks/*.yaml

  replay:
    # The M0 gate: the synthetic estate end to end, zero hardware,
    # deterministic. Golden incidents must produce identical outcomes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - run: make go-build
      - run: make sim
      - name: Replay determinism — same scenario twice, byte-identical evidence
        run: |
          cp sim/out/S-001-night-perimeter/evidence/manifest.json /tmp/run1.json
          make replay SCENARIO=S-001-night-perimeter
          cmp sim/out/S-001-night-perimeter/evidence/manifest.json /tmp/run1.json
